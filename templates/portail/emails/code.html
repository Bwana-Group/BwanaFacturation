<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><title>Votre code de connexion</title></head>
<body style="margin:0; padding:24px 12px; background:#f3f5f9; font-family: Arial, Helvetica, sans-serif; color:#1c2533;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px; margin:0 auto; background:#ffffff; border-radius:14px; border:1px solid #e4e8ef;">
    <tr><td style="padding:32px; text-align:center; font-size:15px; line-height:1.6;">
        <p style="margin:0 0 16px;">Voici votre code de connexion :</p>
        <div style="font-size:34px; font-weight:bold; letter-spacing:8px; color:#1e3a5f; margin-bottom:16px;">{{ code }}</div>
        <p style="margin:0 0 8px;">Il est valable {{ minutes }} minutes et ne sert qu'une seule fois.</p>
        <p style="margin:0; font-size:13px; color:#6b7686;">Ne le communiquez à personne. Si vous n'avez rien demandé, ignorez cet email.</p>
    </td></tr>
</table>
</body>
</html>
